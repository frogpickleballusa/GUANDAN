# Deploys the server function to Supabase whenever it changes on main.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
name: Deploy game function
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy game --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
