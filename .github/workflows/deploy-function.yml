# Optional: deploys the server function to Supabase whenever it changes on main.
# It only runs if two repository secrets exist: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
# Without them it skips quietly (the function can also be deployed from the Supabase dashboard).
name: Deploy game function
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check for Supabase secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy game --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
